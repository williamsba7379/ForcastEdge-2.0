name: Isolated ESPN mocked transport and schedule validation
on:
  push:
    branches: [isolation/week9-readiness-gate-2026]
    paths:
      - scripts/nfl_espn_mock_transport_contract.py
      - tests/test_nfl_espn_mock_transport_contract.py
      - .github/workflows/nfl-espn-mock-transport.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Twenty offline mocked HTTPS and schedule fixtures
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_nfl_espn_mock_transport_contract.py' -v
      - name: Existing offline capture regression fixtures
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_nfl_espn_trusted_capture_offline.py' -v
      - name: Verify no tracked file changes
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'No live HTTP requests, no writes, no production promotion.'
