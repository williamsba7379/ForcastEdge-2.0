name: Test NFL win percentage factor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare fixed candidate against existing strength
        run: python3 scripts/nfl_win_pct_factor_experiment.py
      - name: Save research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-win-pct-factor-experiment.json
          git diff --cached --quiet || (git commit -m "Save experimental NFL win percentage comparison" && git push)
