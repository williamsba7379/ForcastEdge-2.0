name: Three-market research evaluation tests
on:
  pull_request:
    paths:
      - scripts/three_market_evaluation.py
      - tests/test_three_market_evaluation.py
      - .github/workflows/three-market-evaluation-tests.yml
  push:
    branches: [research/three-market-evaluation]
    paths:
      - scripts/three_market_evaluation.py
      - tests/test_three_market_evaluation.py
      - .github/workflows/three-market-evaluation-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_three_market_evaluation.py -v
