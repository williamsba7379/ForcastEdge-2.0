name: Model C official QB depthchart isolated validation
on:
  push:
    paths:
      - 'scripts/model_c_official_qb_depthcharts.py'
      - 'tests/test_model_c_official_qb_depthcharts.py'
      - 'scripts/model_c_official_qb_date_evidence.py'
      - 'scripts/model_c_official_qb_announcements.py'
      - 'scripts/model_c_qb_game_evidence.py'
      - 'tests/test_model_c_qb_game_evidence.py'
      - 'tests/test_model_c_official_qb_announcements.py'
      - 'tests/test_model_c_official_qb_date_evidence.py'
      - '.github/workflows/model-c-official-qb-depthchart-test.yml'
      - 'scripts/model_c_live_game_evidence.py'
      - 'tests/test_model_c_live_game_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline official QB fixtures
        run: python3 tests/test_model_c_official_qb_depthcharts.py
      - name: Offline source-date evidence fixtures
        run: python3 tests/test_model_c_official_qb_date_evidence.py
      - name: Live source-date evidence read-only diagnostic
        run: python3 scripts/model_c_official_qb_date_evidence.py
      - name: Offline official announcement fixtures
        run: python3 tests/test_model_c_official_qb_announcements.py
      - name: Offline game-specific QB evidence fail-closed fixtures
        run: python3 tests/test_model_c_qb_game_evidence.py
      - name: Live official announcement read-only diagnostic
        run: python3 scripts/model_c_official_qb_announcements.py
      - name: Live official four-team QB1 read-only diagnostic
        run: python3 scripts/model_c_official_qb_depthcharts.py
      - name: Offline live-game evidence integration fixtures
        run: python3 tests/test_model_c_live_game_evidence.py
      - name: Live single-matchup evidence (read-only)
        run: |
          mkdir -p diagnostics
          python3 scripts/model_c_live_game_evidence.py > diagnostics/model-c-live-game-evidence.json
          cat diagnostics/model-c-live-game-evidence.json
      - name: Save read-only evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-c-live-game-evidence-${{ github.sha }}
          path: diagnostics/model-c-live-game-evidence.json
          if-no-files-found: warn
