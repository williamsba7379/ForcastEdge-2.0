name: Generate Model C review-only draft
on:
  schedule:
    - cron: '5 15 * * 3'
    - cron: '5 16 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Wednesday 11 AM New York time
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date '+%u %H')" = "3 11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retrieve injury-report snapshot (best effort)\n        if: steps.time.outputs.run == 'true'\n        continue-on-error: true\n        run: python3 scripts/model_c_injuries.py\n      - name: Generate independent Model C review draft
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_engine.py
      - name: Commit draft only
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model-c-automated-draft.json\n          if [ -f data/model-c-injury-snapshot.json ]; then git add data/model-c-injury-snapshot.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Model C review-only draft"
            git push
          fi
