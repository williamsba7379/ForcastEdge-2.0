name: Generate Model C review-only draft
on:
  push:
    paths:
      - '.github/workflows/model-c-draft.yml'
      - 'scripts/model_c_*.py'
      - 'tests/test_model_c_*.py'
      - 'data/model-c-official-qb-source-review.json'
      - 'data/model-c-qb-starters.json'
      - 'data/model-c-qb-reviewed-announcements.json'
  schedule:
    - cron: '5 15 * * 3'
    - cron: '5 16 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Wednesday 11 AM New York time
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ] || [ "$(TZ=America/New_York date '+%u %H')" = "3 11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify QB feed parsing (offline fixture)
        if: steps.time.outputs.run == 'true'
        run: |
          python3 tests/test_model_c_official_news.py
          python3 tests/test_model_c_news_ranking.py
          python3 tests/test_model_c_article_metadata.py
          python3 tests/test_model_c_article_passages.py
          python3 tests/test_model_c_qb_review_queue.py
          python3 tests/test_model_c_starter_verification.py
          python3 tests/test_model_c_qb_feed.py
          python3 tests/test_model_c_espn_qb_status.py
          python3 tests/test_model_c_qb_depthcharts.py
          python3 tests/test_model_c_qb_shadow.py
      - name: Retrieve injury-report snapshot (best effort)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_injuries.py
      - name: Collect completed-game QB passing statistics
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_qb_stats.py
      - name: Collect historical QB game data (research only)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_historical_qb_games.py
      - name: Reconcile missing historical final scores (research only)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_historical_score_reconcile.py
      - name: Audit QB history against final scores
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_historical_qb_audit.py
      - name: Retrieve QB1 depth-chart candidates (best effort)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_qb_depthcharts.py
      - name: Diagnose ESPN depth chart coverage (best effort)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_depthchart_diagnostic.py
      - name: Validate reviewed official QB announcements
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_qb_verified_intake.py
      - name: Generate independent Model C review draft
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_engine.py
      - name: Generate separate Model C-QB experimental shadow
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_qb_shadow.py
      - name: Validate Model C-QB shadow parity
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_qb_shadow_validate.py
      - name: Generate fresh four-model comparison from current pregame inputs
        if: steps.time.outputs.run == 'true'
        run: |
          python3 tests/test_nfl_four_model_refresh.py
          python3 scripts/nfl_four_model_refresh.py
      - name: Audit unmodeled critical QB injuries
        if: steps.time.outputs.run == 'true'
        run: |
          python3 scripts/model_c_qb_injury_audit_v2.py
          python3 tests/test_model_c_qb_injury_audit_v2.py
      - name: Build official quarterback source review queue
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_qb_review_queue.py
      - name: Validate ESPN QB matchup flags
        if: steps.time.outputs.run == 'true'
        run: |
          if [ -f data/model-c-espn-qb-status.json ]; then python3 scripts/model_c_espn_queue_validation.py; fi
      - name: Discover official team QB news links (pilot, best effort)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_official_news.py
      - name: Validate official news discovery snapshot
        if: steps.time.outputs.run == 'true'
        run: python3 tests/test_model_c_discovery_snapshot.py
      - name: Rank official QB news for manual review
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_news_ranking.py
      - name: Fetch official article publication metadata (best effort)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_article_metadata.py
      - name: Audit official article publication dates
        if: steps.time.outputs.run == 'true'
        run: |
          if [ -f data/model-c-official-article-metadata.json ]; then python3 scripts/model_c_article_metadata_audit.py; fi
      - name: Extract QB passages from official articles
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/model_c_article_passages.py
      - name: Validate saved QB passage recency gate
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_passage_gate_validation.py
      - name: Audit ranked QB news coverage
        if: steps.time.outputs.run == 'true'
        run: python3 scripts/model_c_ranking_audit.py
      - name: Validate generated Model C review draft
        if: steps.time.outputs.run == 'true'
        run: python3 tests/test_model_c_draft_contract.py
      - name: Commit draft only
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/model-c-qb-starters.json ]; then git add data/model-c-qb-starters.json; fi
          if [ -f data/model-c-qb-shadow.json ]; then git add data/model-c-qb-shadow.json; fi
          if [ -f data/model-c-qb-shadow-validation.json ]; then git add data/model-c-qb-shadow-validation.json; fi
          if [ -f data/model-c-qb-injury-audit-v2.json ]; then git add data/model-c-qb-injury-audit-v2.json; fi
          git add data/four-model-head-to-head/*-refresh-*.json
          git add data/model-c-automated-draft.json data/model-c-qb-review-queue.json data/model-c-qb-ranked-news.json data/model-c-qb-ranking-audit.json
          if [ -f data/model-c-official-article-metadata.json ]; then git add data/model-c-official-article-metadata.json; fi
          if [ -f data/model-c-article-metadata-audit.json ]; then git add data/model-c-article-metadata-audit.json; fi
          if [ -f data/model-c-qb-article-passages.json ]; then git add data/model-c-qb-article-passages.json; fi
          if [ -f data/model-c-official-qb-discovery.json ]; then git add data/model-c-official-qb-discovery.json; fi
          if [ -f data/model-c-qb-performance.json ]; then git add data/model-c-qb-performance.json; fi
          if [ -f data/model-c-historical-qb-games.json ]; then git add data/model-c-historical-qb-games.json; fi
          if [ -f data/model-c-historical-qb-audit.json ]; then git add data/model-c-historical-qb-audit.json; fi
          if [ -f data/model-c-historical-score-reconciliation.json ]; then git add data/model-c-historical-score-reconciliation.json; fi
          if [ -f data/nfl-historical-results.json ]; then git add data/nfl-historical-results.json; fi
          if [ -f data/model-c-qb-candidates.json ]; then git add data/model-c-qb-candidates.json; fi
          if [ -f data/model-c-qb-depthcharts.json ]; then git add data/model-c-qb-depthcharts.json; fi
          if [ -f data/model-c-depthchart-diagnostic.json ]; then git add data/model-c-depthchart-diagnostic.json; fi
          if [ -f data/model-c-injury-snapshot.json ]; then git add data/model-c-injury-snapshot.json; fi
          if [ -f data/model-c-espn-qb-status.json ]; then git add data/model-c-espn-qb-status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Model C review-only draft"
            git push
          fi

# Manual expedited refresh requested 2026-10-28 before 15:30 ET; preserve QB safeguards.
