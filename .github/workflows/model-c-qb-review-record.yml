name: Model C official QB evidence review record
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/model_c_qb_review_record.py'
      - '.github/workflows/model-c-qb-review-record.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline official QB evidence review fixtures
        run: python3 scripts/model_c_qb_review_record.py
