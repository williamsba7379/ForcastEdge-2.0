name: Grade frozen NFL Models A B C
on:
  push:
    paths:
      - 'scripts/compare_models_week7.py'
      - '.github/workflows/compare-nfl-models.yml'
      - 'data/prospective-head-to-head/2026-10-22.json'
      - 'data/model-c-week7-2026.json'
      - 'data/nfl-scoreboard.json'
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grade identical frozen Week 7 games
        run: python3 scripts/compare_models_week7.py
      - name: Publish comparison results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model-comparison-week7-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Grade frozen Week 7 A B C predictions"
            git push
          fi
