name: NFL four-model Wednesday review preflight (nonpublishing)
on:
  schedule:
    - cron: '0 15 * * 3'
    - cron: '0 16 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Wednesday 11 AM America/New_York window
        id: window
        env:
          TZ: America/New_York
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo("America/New_York"))
          eligible = now.weekday() == 2 and now.hour == 11
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("eligible=" + str(eligible).lower() + "\n")
          print("Eastern:", now.isoformat(), "eligible:", eligible)
          PY
      - name: Prepare current-week four-model review from authentic existing inputs
        if: steps.window.outputs.eligible == 'true'
        run: |
          mkdir -p /tmp/forecastedge-review
          python3 scripts/nfl_current_week_review_handoff.py \
            --schedule data/nfl-schedule.json \
            --draft data/model-c-automated-draft.json \
            --shadow data/model-c-qb-shadow.json \
            --history data/nfl-historical-results.json \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json /tmp/forecastedge-review/four-model-review-latest.json \
            --html /tmp/forecastedge-review/four-model-review.html
          echo 'REVIEW ONLY: local runner files; no upload, commit, push, deployment or publication'
