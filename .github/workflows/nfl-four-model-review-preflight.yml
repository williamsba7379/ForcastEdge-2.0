name: NFL four-model delivery monitor (read-only, nonpublishing)
on:
  schedule:
    - cron: '20 15 * * 3'
    - cron: '20 16 * * 3'
    - cron: '20 17 * * 3'
    - cron: '20 18 * * 3'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nfl-review-monitor-${{ github.ref }}
  cancel-in-progress: false
# Scheduled checks only execute from the default branch; this repair branch is not deployed.
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect scheduled same-day Model C run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo("America/New_York"))
          if now.weekday() != 2:
              print("NOT_SCHEDULED_WEDNESDAY; DELIVERY_UNVERIFIED")
              raise SystemExit(1)
          date = now.date()
          repo = os.environ["GH_REPOSITORY"]
          base = "https://api.github.com/repos/" + repo
          def get(path):
              req = urllib.request.Request(base + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          try:
              runs = get("/actions/workflows/model-c-draft.yml/runs?event=schedule&per_page=100")["workflow_runs"]
              candidates = [r for r in runs if
                  dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(ZoneInfo("America/New_York")).date() == date]
              if not candidates:
                  raise ValueError("No scheduled same-day Model C run")
              # Check all attempts from today's scheduled runs; never silently
              # substitute a later run for an earlier missing or failed run.
              states = []
              for r in sorted(candidates, key=lambda x: (x["run_number"], x["run_attempt"])):
                  attempt = r["run_attempt"]
                  label = "run=" + str(r["id"]) + " attempt=" + str(attempt)
                  if r["status"] != "completed":
                      states.append(("PENDING", label))
                      continue
                  if r["conclusion"] != "success":
                      states.append(("FAILED", label + " conclusion=" + str(r["conclusion"])))
                      continue
                  arts = get("/actions/runs/" + str(r["id"]) + "/artifacts?per_page=100")["artifacts"]
                  expected = "nfl-review-" + str(r["id"]) + "-" + str(attempt)
                  matches = [a for a in arts if a["name"] == expected and not a.get("expired")]
                  if len(matches) != 1:
                      states.append(("MISSING", label))
                      continue
                  uploaded = dt.datetime.fromisoformat(matches[0]["created_at"].replace("Z", "+00:00"))
                  cutoff = dt.datetime.combine(date, dt.time(11), ZoneInfo("America/New_York"))
                  status = "LATE_METADATA_PRESENT" if uploaded > cutoff else "METADATA_PRESENT"
                  states.append((status, label + " artifact_id=" + str(matches[0]["id"])))
              for status, detail in states:
                  print(status, detail, "REVIEW_ONLY_UNPUBLISHED DELIVERY_UNVERIFIED integrityVerified=false")
              if any(status in ("PENDING", "FAILED", "MISSING") for status, _ in states):
                  raise ValueError("At least one scheduled run is pending, failed, or missing its archive")
          except Exception as exc:
              print("DELIVERY_UNVERIFIED; BLOCKED:", str(exc))
              raise SystemExit(1)
          PY
