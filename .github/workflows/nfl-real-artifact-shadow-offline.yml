name: NFL real-artifact shadow verifier offline checks
on:
  push:
    branches:
      - research/nfl-real-artifact-shadow-verifier
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated mocked GitHub artifact authentication checks
        run: |
          python3 -m unittest discover -s tests -p test_nfl_real_artifact_shadow.py -v
          python3 -m unittest discover -s tests -p test_nfl_week9_real_replay_shadow.py -v
          python3 -m unittest discover -s tests -p test_nfl_shadow_security_lineage.py -v
      - name: Live read-only replay of actual pinned Week 9 research artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 research/nfl_week9_live_shadow.py
