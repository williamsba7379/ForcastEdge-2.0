name: Test NFL strength of schedule factor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare SOS coefficients with baseline
        run: python3 scripts/nfl_sos_experiment.py
      - name: Save experimental results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-sos-experiment.json
          git diff --cached --quiet || (git commit -m "Record exploratory SOS experiment" && git push)
