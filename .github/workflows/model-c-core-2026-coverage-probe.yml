name: Model C Core 2026 32-team QB coverage probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/model_c_core_2026_coverage_probe.py'
      - '.github/workflows/model-c-core-2026-coverage-probe.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Offline fail-closed 32-team coverage fixtures
        run: python3 scripts/model_c_core_2026_coverage_probe.py
      - name: Read-only live 32-team ESPN Core coverage
        run: python3 scripts/model_c_core_2026_coverage_probe.py --live
