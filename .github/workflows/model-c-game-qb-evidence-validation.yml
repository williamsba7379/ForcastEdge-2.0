name: Model C game-specific QB evidence validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/model_c_game_qb_evidence_validator.py'
      - '.github/workflows/model-c-game-qb-evidence-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline game-specific QB starter safeguards
        run: python3 scripts/model_c_game_qb_evidence_validator.py
      - name: Read-only live-mode safety check
        run: python3 scripts/model_c_game_qb_evidence_validator.py --live
