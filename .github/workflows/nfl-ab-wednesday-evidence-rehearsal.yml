name: NFL A-B manual Wednesday evidence rehearsal (research only)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'offline-tests, capture, or review; default never accesses live sites'
        required: true
        type: choice
        options:
          - offline-tests
          - capture
          - review
        default: offline-tests
      season:
        description: 'NFL season (capture only)'
        required: false
        type: string
      week:
        description: 'NFL week (capture only)'
        required: false
        type: string
      cutoff:
        description: 'Wednesday 11 AM ET as offset-aware ISO timestamp (capture only)'
        required: false
        type: string
      capture_run_id:
        description: 'Existing capture run ID (review only)'
        required: false
        type: string
      capture_commit_sha:
        description: 'Exact 40-character capture commit SHA (review only)'
        required: false
        type: string
      reviewed_manifest_commit_sha:
        description: 'Exact reviewed manifest commit SHA after capture'
        required: false
        type: string
      reviewed_games_sha256:
        description: 'SHA-256 of separately reviewed manifest committed after capture'
        required: false
        type: string
      reviewed_games_path:
        description: 'Reviewed manifest path in checkout (review only)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed offline tests
        run: |
          python -m unittest discover -s tests -p 'test_nfl_ab_*.py' -v
  capture:
    if: ${{ inputs.stage == 'capture' }}
    needs: offline-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture independent raw evidence, never freeze
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          test -n "$SEASON" && test -n "$WEEK" && test -n "$CUTOFF"
          python -m scripts.nfl_ab_two_stage_rehearsal capture --season "$SEASON" --week "$WEEK" --cutoff "$CUTOFF" --output "$RUNNER_TEMP/nfl-ab-raw-capture.json"
      - name: Upload immutable research-only capture
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ab-raw-capture
          path: ${{ runner.temp }}/nfl-ab-raw-capture.json
          retention-days: 30
          if-no-files-found: error
  review:
    if: ${{ inputs.stage == 'review' }}
    needs: offline-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact capture run, artifact identity and reviewed manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.capture_run_id }}
          CAPTURE_SHA: ${{ inputs.capture_commit_sha }}
          REVIEW_COMMIT: ${{ inputs.reviewed_manifest_commit_sha }}
          REVIEW_HEAD: ${{ github.sha }}
          REVIEWED: ${{ inputs.reviewed_games_path }}
          REVIEW_SHA: ${{ inputs.reviewed_games_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from scripts.nfl_ab_review_provenance_guard import validate_capture_run, validate_artifact_expiry, validate_capture_review_chain, validate_review_manifest
          rid=os.environ["CAPTURE_RUN"]
          sha=os.environ["CAPTURE_SHA"]
          repo=os.environ["REPO"]
          run=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}"]))
          validate_capture_run(run,rid,sha)
          review_sha=os.environ["REVIEW_COMMIT"]
          if review_sha!=os.environ["REVIEW_HEAD"]:
              raise ValueError("REVIEW_HEAD_MISMATCH")
          ancestor=subprocess.run(["git","merge-base","--is-ancestor",sha,review_sha],check=False).returncode==0
          manifest_commit=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/commits/{review_sha}"]))
          validate_capture_review_chain(run,sha,review_sha,manifest_commit,ancestor)
          changed=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",review_sha],text=True).splitlines()
          if os.environ["REVIEWED"] not in changed:
              raise ValueError("MANIFEST_NOT_COMMITTED_IN_REVIEW_COMMIT")
          artifacts=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}/artifacts"]))["artifacts"]
          matches=[a for a in artifacts if a.get("name")=="nfl-ab-raw-capture"]
          if len(matches)!=1:
              raise ValueError("MISSING_OR_DUPLICATE_CAPTURE_ARTIFACT")
          from datetime import datetime,timezone
          validate_artifact_expiry(matches[0],rid,datetime.now(timezone.utc).isoformat())
          pathlib.Path(os.environ["RUNNER_TEMP"],"nfl-ab-artifact-metadata.json").write_text(json.dumps(matches[0]))
          path=os.environ["REVIEWED"]
          data=pathlib.Path(path).read_bytes()
          validate_review_manifest(path,os.environ["REVIEW_SHA"],data)
          PY
      - name: Download and verify exact capture archive and extracted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          from scripts.nfl_ab_review_provenance_guard import verify_archive_digest
          metadata=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"nfl-ab-artifact-metadata.json").read_text())
          archive=subprocess.check_output(["gh","api",f"repos/{os.environ['REPO']}/actions/artifacts/{metadata['id']}/zip"])
          verify_archive_digest(archive,metadata)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              if z.namelist()!=["nfl-ab-raw-capture.json"]:
                  raise ValueError("UNEXPECTED_CAPTURE_ARCHIVE_MEMBERS")
              content=z.read("nfl-ab-raw-capture.json")
          bundle=json.loads(content)
          if bundle.get("kind")!="RESEARCH_ONLY_INDEPENDENT_CAPTURE":
              raise ValueError("INVALID_CAPTURE_ARCHIVE_CONTENT")
          output=pathlib.Path(os.environ["RUNNER_TEMP"],"captured")
          output.mkdir(exist_ok=True)
          (output/"nfl-ab-raw-capture.json").write_bytes(content)
          PY
      - name: Review original capture without changing its timestamps
        env:
          REVIEWED: ${{ inputs.reviewed_games_path }}
        run: |
          python -m scripts.nfl_ab_two_stage_rehearsal review --bundle "$RUNNER_TEMP/captured/nfl-ab-raw-capture.json" --reviewed-games "$REVIEWED" --output "$RUNNER_TEMP/nfl-ab-reviewed-comparison.json"
      - name: Upload research-only review
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ab-reviewed-comparison
          path: ${{ runner.temp }}/nfl-ab-reviewed-comparison.json
          retention-days: 30
          if-no-files-found: error
