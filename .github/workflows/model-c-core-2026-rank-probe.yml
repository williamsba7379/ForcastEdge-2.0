name: Model C Core 2026 QB rank probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/model_c_core_2026_rank_probe.py'
      - '.github/workflows/model-c-core-2026-rank-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline fail-closed fixtures
        run: python3 scripts/model_c_core_2026_rank_probe.py
      - name: Read-only live 2026 ESPN Core QB rank probe
        run: python3 scripts/model_c_core_2026_rank_probe.py --live
