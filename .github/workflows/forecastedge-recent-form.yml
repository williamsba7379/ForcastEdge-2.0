name: Test NFL recent three-game form factor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare recent-form weights against existing baseline
        run: python3 scripts/nfl_recent_form_experiment.py
      - name: Save experimental results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-recent-form-experiment.json
          git diff --cached --quiet || (git commit -m "Record recent-form factor experiment" && git push)
