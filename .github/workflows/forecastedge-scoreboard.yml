name: Update NFL weekly scoreboard
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NFL regular-season week scoreboard
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          today=datetime.datetime.now(datetime.timezone.utc).date()
          # The season year rolls over after the Super Bowl.
          year=today.year if today.month>=3 else today.year-1
          url=f"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates={year}&seasontype=2&week=6"
          req=urllib.request.Request(url,headers={"User-Agent":"ForecastEdge/2.0"})
          with urllib.request.urlopen(req,timeout=30) as response:
              board=json.load(response)
          if not isinstance(board.get("events"),list):
              raise ValueError("Invalid scoreboard response")
          path=pathlib.Path("data/nfl-scoreboard.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(board,separators=(",",":"))+"\n")
          print(f"Saved {len(board['events'])} NFL events")
          PY
      - name: Commit updated scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-scoreboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL Week 6 scoreboard"
            git push
          fi
