name: NFL four-model operational readiness research tests
on:
  push:
    branches:
      - repair/nfl-four-model-operational-guards
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed four-model readiness
        run: python3 -m unittest discover -s tests -p test_nfl_operational_readiness.py -v
