name: NFL delivery fail-closed research
on:
  push:
    branches:
      - repair/nfl-weekly-delivery-failclosed-20261111
  pull_request:
    branches:
      - main
    paths:
      - 'research/nfl_delivery_failclosed.py'
      - 'research/nfl_four_model_shadow_handoff.py'
      - 'tests/test_nfl_delivery_failclosed.py'
      - '.github/workflows/nfl-delivery-failclosed-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed synthetic unit tests
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -p test_nfl_delivery_failclosed.py -v
      - name: Assert actual current-week artifacts are rejected when incomplete
        run: |
          if python3 research/nfl_delivery_failclosed.py > /tmp/nfl-delivery-readiness.json; then
            cat /tmp/nfl-delivery-readiness.json
            echo "Real delivery passed: separately review provenance and model independence."
          else
            cat /tmp/nfl-delivery-readiness.json
            echo "Expected fail-closed result: real delivery NOT READY."
          fi

      - name: Execute isolated real-engine rehearsal (research only)
        env:
          PYTHONPATH: .
        run: |
          set +e
          python3 research/nfl_four_model_shadow_handoff.py > /tmp/nfl-real-engine-rehearsal.json 2>&1
          code=$?
          set -e
          cat /tmp/nfl-real-engine-rehearsal.json
          echo "Rehearsal exit code: $code"
          echo "Rehearsal is diagnostic only; never certifies Wednesday pre-cutoff delivery."
          if [ "$code" -ne 0 ]; then
            echo "::error::Isolated real-engine rehearsal failed with exit code $code"
            exit "$code"
          fi
          if [ "$code" -eq 0 ]; then
            grep -q '"status": "RESEARCH_ONLY_NOT_DELIVERABLE"' /tmp/nfl-real-engine-rehearsal.json
            grep -q '"games": 14' /tmp/nfl-real-engine-rehearsal.json
            grep -q '"winnerRows": 56' /tmp/nfl-real-engine-rehearsal.json
            grep -q '"published": false' /tmp/nfl-real-engine-rehearsal.json
            grep -q '"historicalWednesdayFreezeVerified": false' /tmp/nfl-real-engine-rehearsal.json
          fi

# Draft-only research. No frozen artifacts are written to the checkout.
