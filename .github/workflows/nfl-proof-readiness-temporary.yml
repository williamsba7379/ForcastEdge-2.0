name: NFL isolated proof readiness - temporary 110 offline tests
on:
  push:
    branches:
      - audit/historical-availability-validator
    paths:
      - .github/workflows/nfl-proof-readiness-temporary.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all 110 isolated offline evidence tests
        shell: bash
        env:
          PYTHONPATH: scripts:tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nfl_historical_availability_audit.py' -v 2>&1 | tee /tmp/nfl-suite-01.log
          python -m unittest discover -s tests -p 'test_nfl_future_final_evidence.py' -v 2>&1 | tee /tmp/nfl-suite-02.log
          python -m unittest discover -s tests -p 'test_nfl_future_evidence_safeguards.py' -v 2>&1 | tee /tmp/nfl-suite-03.log
          python -m unittest discover -s tests -p 'test_nfl_sqlite_evidence_store.py' -v 2>&1 | tee /tmp/nfl-suite-04.log
          python -m unittest discover -s tests -p 'test_nfl_sqlite_crash_recovery.py' -v 2>&1 | tee /tmp/nfl-suite-05.log
          python -m unittest discover -s tests -p 'test_nfl_sqlite_tamper_evidence.py' -v 2>&1 | tee /tmp/nfl-suite-06.log
          python -m unittest discover -s tests -p 'test_nfl_offline_capture_envelope.py' -v 2>&1 | tee /tmp/nfl-suite-07.log
          python -m unittest discover -s tests -p 'test_nfl_signed_evidence_manifest.py' -v 2>&1 | tee /tmp/nfl-suite-08.log
          python -m unittest discover -s tests -p 'test_nfl_offline_evidence_integration.py' -v 2>&1 | tee /tmp/nfl-suite-09.log
          python -m unittest discover -s tests -p 'test_nfl_offline_readiness_gate.py' -v 2>&1 | tee /tmp/nfl-suite-10.log
          python -m unittest discover -s tests -p 'test_nfl_offline_external_proof_verifier.py' -v 2>&1 | tee /tmp/nfl-suite-11.log
          python -m unittest discover -s tests -p 'test_nfl_offline_proof_readiness_integration.py' -v 2>&1 | tee /tmp/nfl-suite-12.log
      - name: Upload isolated test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-nfl-110-test-logs
          path: /tmp/nfl-suite-*.log
          retention-days: 14
