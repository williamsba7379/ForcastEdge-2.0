name: Isolated Week 9 verified four-model freeze
on:
  push:
    branches:
      - isolation/week9-readiness-gate-2026
    paths:
      - .github/workflows/nfl-week9-freeze-isolated.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gated-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no Week 9 original or existing refresh can be overwritten
        run: |
          test ! -e data/four-model-head-to-head/2026-week-9.json
          if find data/four-model-head-to-head -maxdepth 1 -name '2026-week-9-refresh-*.json' | grep -q .; then
            echo 'Week 9 refresh already exists: refusing duplicate freeze'; exit 1
          fi
      - name: Validate offline safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_nfl_week9_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_nfl_market_week_isolation.py' -v
      - name: Refresh independent Model C
        run: python3 scripts/model_c_engine.py
      - name: Refresh experimental Model C-QB
        run: |
          python3 scripts/model_c_qb_shadow.py
          python3 scripts/model_c_qb_shadow_validate.py
      - name: Validate 15 games, pre-kickoff timestamps and QB evidence
        run: |
          set -o pipefail
          python3 scripts/nfl_week9_readiness.py | tee week9-readiness.json
      - name: Recompute A and B and generate new four-model card
        run: |
          python3 tests/test_nfl_four_model_refresh.py
          python3 scripts/nfl_four_model_refresh.py
      - name: Validate frozen candidate and ensure no historical changes
        run: |
          python3 - <<'PY'
          import glob,json,subprocess
          paths=glob.glob('data/four-model-head-to-head/2026-week-9-refresh-*.json')
          assert len(paths)==1, 'Exactly one Week 9 candidate required'
          card=json.load(open(paths[0]))
          assert (card['season'],card['week'],len(card['games']))==(2026,9,15)
          assert card['status']=='FRESH_PREKICKOFF_SNAPSHOT'
          assert all(set(g['picks'])=={'A','B','C','C-QB'} for g in card['games'])
          changed=subprocess.check_output(['git','status','--porcelain'],text=True)
          assert not any(line[3:].startswith('data/four-model-head-to-head/2026-week-8') for line in changed.splitlines()), 'Week 8 modified'
          print('Validated candidate:',paths[0])
          PY
      - name: Commit only new timestamped Week 9 card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/four-model-head-to-head/2026-week-9-refresh-*.json
          git diff --cached --name-only | grep -E '^data/four-model-head-to-head/2026-week-9-refresh-[0-9]{8}T[0-9]{6}Z.json$'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Freeze independent 2026 Week 9 four-model pregame refresh (isolated)'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week9-isolated-freeze-evidence
          if-no-files-found: ignore
          path: |
            week9-readiness.json
            data/four-model-head-to-head/2026-week-9-refresh-*.json
