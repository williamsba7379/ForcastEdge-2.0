name: Isolated offline trusted ESPN capture
on:
  push:
    branches: [isolation/week9-readiness-gate-2026]
    paths:
      - scripts/nfl_espn_trusted_capture_offline.py
      - tests/test_nfl_espn_trusted_capture_offline.py
      - .github/workflows/nfl-espn-capture-offline-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run 17 offline hostile ESPN capture fixtures
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_nfl_espn_trusted_capture_offline.py' -v
      - name: Confirm archived blob verifier tests still pass
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_nfl_future_immutable_evidence.py' -v
      - name: Verify no tracked files changed
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'Offline only. No live capture or production promotion.'
