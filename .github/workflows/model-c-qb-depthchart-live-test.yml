name: Model C QB depthchart live validation
on:
  pull_request:
    paths:
      - '.github/workflows/model-c-qb-depthchart-live-test.yml'
      - 'scripts/model_c_qb_depthcharts.py'
      - 'tests/test_model_c_qb_depthcharts.py'
  push:
    paths:
      - '.github/workflows/model-c-qb-depthchart-live-test.yml'
      - 'scripts/model_c_qb_depthcharts.py'
      - 'tests/test_model_c_qb_depthcharts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline depthchart parser fixtures
        run: python3 tests/test_model_c_qb_depthcharts.py
      - name: Retrieve live ESPN QB depthchart candidates
        run: python3 scripts/model_c_qb_depthcharts.py
      - name: Validate nonzero QB1 coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/model-c-qb-depthcharts.json").read_text())
          teams=d["teams"]
          covered=sum(bool(v["qb1Candidate"]) for v in teams.values())
          print(f"Depth chart QB1 candidates: {covered}/{len(teams)}")
          assert len(teams)>=25 and covered>0, "Insufficient usable QB1 coverage"
          PY
