name: Isolated Week 9 historical integrity research
on:
  push:
    branches:
      - isolation/week9-readiness-gate-2026
    paths:
      - .github/workflows/nfl-week9-integrity-research.yml
      - scripts/nfl_week9_integrity_research.py
      - tests/test_nfl_week9_integrity_research.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historical-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline historical audit tests
        run: python3 -m unittest discover -s tests -p 'test_nfl_week9_integrity_research.py' -v
      - name: Capture current raw-source hashes and replay without touching frozen data
        id: replay
        continue-on-error: true
        run: python3 scripts/nfl_week9_integrity_research.py
      - name: Validate current retrieval hashes, timestamps and complete research rows
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, re, datetime
          ev=[json.load(open(p)) for p in glob.glob('research/week9-integrity/week8-evidence-*.json')]
          rp=[json.load(open(p)) for p in glob.glob('research/week9-integrity/week9-replay-*.json')]
          assert len(ev)==len(rp)==1
          e=ev[0]; report=rp[0]
          assert len(e['games'])==14 and len(report['replayedGames'])==15
          assert e['week9AvailabilityVerified'] is False and report['historicalAvailabilityProven'] is False
          assert all(g['finalizationTimestamp'] is None and g['originalRetrievalTimestamp'] is None for g in e['games'])
          assert len(e['sources'])>=2
          for src in e['sources']:
            assert src['httpStatus']==200 and re.fullmatch('[0-9a-f]{64}',src['sha256RawResponse'])
            assert src['byteCount']>0
            datetime.datetime.fromisoformat(src['retrievedAt'])
            print('Verified current-source metadata:',src['url'],src['retrievedAt'],src['sha256RawResponse'])
          assert len({g['id'] for g in report['replayedGames']})==15
          assert all(g['eligibility']=='NOT_PROVEN_AS_OF_FREEZE' for g in report['replayedGames'])
          print('Replay baseline discrepancies:',len(report['baselineDiscrepancies']))
          print('Conditional changes:',report['changedGames'],'Promotion permitted: NO')
          PY
      - name: Upload research-only evidence even on baseline mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week9-integrity-research-only
          if-no-files-found: warn
          path: research/week9-integrity/*.json
      - name: Commit only new timestamped research evidence (never historical or frozen files)
        if: always()
        run: |
          if ! ls research/week9-integrity/week8-evidence-*.json >/dev/null 2>&1; then
            echo 'No source evidence captured; cannot commit'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/week9-integrity/week8-evidence-*.json research/week9-integrity/week9-replay-*.json
          git diff --cached --name-only | grep -vE '^research/week9-integrity/(week8-evidence|week9-replay)-[0-9]{8}T[0-9]{6}Z.json$' && exit 1 || true
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Archive immutable Week 8 source retrieval and Week 9 research replay evidence'
          git fetch origin isolation/week9-readiness-gate-2026
          git rebase origin/isolation/week9-readiness-gate-2026
          git push origin HEAD:isolation/week9-readiness-gate-2026
      - name: Report research-only status without authorizing promotion
        run: |
          echo 'Research archive completed; this workflow has NO production promotion action.'
          echo 'Original finalization/retrieval timestamps remain unknown; promotion NOT authorized.'
          echo 'Replay outcome: ${{ steps.replay.outcome }}; baseline discrepancies are retained in the archived report.'
