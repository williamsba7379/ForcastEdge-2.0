name: Isolated NFL Week 9 provenance regression
on:
  push:
    branches:
      - audit/nfl-week9-freeze-provenance-regression
    paths:
      - 'tests/test_nfl_week9_provenance_regression.py'
      - '.github/workflows/nfl-week9-provenance-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed offline regression tests
        run: python3 -m unittest discover -s tests -p test_nfl_week9_provenance_regression.py -v
