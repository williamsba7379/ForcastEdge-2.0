name: NFL isolated evidence safeguards - temporary offline tests
on:
  push:
    branches:
      - audit/historical-availability-validator
    paths:
      - .github/workflows/nfl-evidence-safeguards-temporary.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run original 28 and new safeguards
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_nfl_historical_availability_audit.py' -v 2>&1 | tee /tmp/historical.log
          python -m unittest discover -s tests -p 'test_nfl_future_final_evidence.py' -v 2>&1 | tee /tmp/future.log
          python -m unittest discover -s tests -p 'test_nfl_future_evidence_safeguards.py' -v 2>&1 | tee /tmp/safeguards.log
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-evidence-safeguards
          path: /tmp/*.log
          retention-days: 14
