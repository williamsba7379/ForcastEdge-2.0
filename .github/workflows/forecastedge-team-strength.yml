name: Calculate NFL team strength
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  team-strength:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate team metrics and walk-forward baseline
        run: python3 scripts/nfl_team_strength.py
      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-team-strength.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL team strength baseline and walk-forward results"
            git push
          fi
