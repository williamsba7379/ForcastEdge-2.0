name: NFL future evidence - temporary isolated 28 tests
on:
  push:
    branches:
      - audit/historical-availability-validator
    paths:
      - .github/workflows/nfl-future-evidence-temporary-tests.yml

permissions:
  contents: read

jobs:
  offline-28-tests:
    if: github.ref == 'refs/heads/audit/historical-availability-validator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run both isolated offline suites
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/forecastedge-evidence
          python -m unittest discover -s tests -p 'test_nfl_*evidence.py' -v 2>&1 | tee /tmp/forecastedge-evidence/results.log
          python -m unittest discover -s tests -p 'test_nfl_historical_availability_audit.py' -v 2>&1 | tee -a /tmp/forecastedge-evidence/results.log
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-28-offline-evidence-tests
          path: /tmp/forecastedge-evidence/results.log
          if-no-files-found: error
          retention-days: 14
