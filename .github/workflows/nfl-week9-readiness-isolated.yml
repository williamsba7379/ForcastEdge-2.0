name: Isolated NFL Week 9 readiness audit
on:
  workflow_dispatch:
  push:
    branches:
      - isolation/week9-readiness-gate-2026
    paths:
      - scripts/nfl_week9_readiness.py
      - tests/test_nfl_week9_readiness.py
      - tests/test_nfl_market_week_isolation.py
      - scripts/nfl_market_totals_compare.py
      - .github/workflows/nfl-week9-readiness-isolated.yml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline fail-closed fixtures
        run: python3 -m unittest discover -s tests -p 'test_nfl_week9_readiness.py' -v
      - name: Market-week regression fixtures
        run: python3 -m unittest discover -s tests -p 'test_nfl_market_week_isolation.py' -v
      - name: Audit Week 9 inputs (fail closed)
        run: |
          set -o pipefail
          python3 scripts/nfl_week9_readiness.py | tee week9-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week9-readiness-audit
          path: week9-readiness.json
