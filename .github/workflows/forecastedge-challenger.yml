name: Compare NFL challenger
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate experimental comparison
        run: python3 scripts/nfl_challenger.py
      - name: Publish comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-challenger-comparison.json
          git diff --cached --quiet || (git commit -m "Update NFL challenger comparison" && git push)
