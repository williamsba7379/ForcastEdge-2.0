name: Four-model NFL head-to-head
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * 3'
    - cron: '15 16 * * 3'
    - cron: '30 9 * * 2'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze or grade identical NFL games
        run: python3 scripts/nfl_four_model_head_to_head.py
      - name: Commit immutable picks and updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four-model-head-to-head/
          if ! git diff --cached --quiet; then
            git commit -m "Update frozen four-model NFL comparison"
            git pull --rebase
            git push
          fi
